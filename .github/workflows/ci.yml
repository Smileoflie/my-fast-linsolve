name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
    env:
      # Make "the extension silently did not build" a hard failure in CI.
      LINSOLVE_REQUIRE_CYTHON: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numba
          # Plain `pip install -e .`: build isolation pulls setuptools>=77,
          # numpy and Cython from [build-system].requires. Do NOT add
          # --no-build-isolation here -- Python 3.12+ venvs ship pip only, so
          # there is no setuptools, and the build dies with
          # BackendUnavailable: Cannot import 'setuptools.build_meta'.
          pip install -e .

      - name: Backends available
        run: python -c "import linsolve; print(linsolve.backend_info())"

      - name: Tests (every backend, including the compiled Cython kernels)
        run: python -m pytest -q

      - name: The compiled backend must actually be active
        run: |
          python -c "import sys, linsolve; print(linsolve.backend_info()); sys.exit(0 if linsolve.ACTIVE_BACKEND.value == 'cython' else 1)"

  benchmarks:
    name: benchmarks (informational)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install numba
          pip install -e .
      - name: Single-threaded comparison against LAPACK
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMBA_NUM_THREADS: "1"
        run: python -m benchmarks.benchmark --n 1000 --repeat 3

  build_wheels:
    name: wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.22
        env:
          LINSOLVE_REQUIRE_CYTHON: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: sdist
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz

  publish:
    name: publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Opt in only after configuring PyPI trusted publishing for this repo
    # (PyPI -> project -> Publishing -> Add a new pending publisher), or by
    # switching the action to a PYPI_API_TOKEN secret. Without the variable the
    # job is skipped, so a release never shows up as a spurious failure.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH_ENABLED == 'true'
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing, no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # uncomment (and set a PYPI_API_TOKEN secret) if you prefer a token
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
