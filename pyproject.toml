[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-linsolve"
version = "0.1.1"
description = "高性能线性方程组求解器库：3 种直接法 + 3 种迭代法，Numba JIT 与 Cython 深度优化。"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lielielie" }]
keywords = ["linear-algebra", "numerical-methods", "solver", "numba", "cython", "scientific-computing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# Numba JIT acceleration layer (optional; library falls back to pure NumPy if absent)
numba = ["numba>=0.57"]
# Cython static compilation layer (optional; requires a C compiler at build time)
cython = ["cython>=0.29"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "sphinx>=5",
    "sphinx-rtd-theme",
    "twine",
    "build",
]

[project.urls]
Homepage = "https://github.com/Smileoflie/my-fast-linsolve"
Repository = "https://github.com/Smileoflie/my-fast-linsolve"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
